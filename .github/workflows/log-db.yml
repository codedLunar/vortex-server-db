name: LogDB

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  log-db:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: run main
        run: node update.js

      - name: add updated db
        run: |
          git config --global user.name "Mr update bot"
          git config --global user.email "actions@github.com"

          git add log.json

          if git diff --cached --quiet; then
            echo "No database changes"
            exit 0
          fi

          git commit -m "log db"

          git pull --rebase origin main

          git push origin main
