<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart.js Pie Chart Example</title>
    <!-- we be using chart.js and color thief for this -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <style>

    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');


        .chart-container {
            width: 400px;
            margin: 50px auto;
        }


        html, body {
            background-color: rgb(12, 12, 12);
            overflow: hidden;
        }

        * {
            font-family: Roboto;
        }

        h1, h2, h3, h4, h5, h6, p, a {
            color: rgb(245,245,245);
        }

        #title {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 5px;
        }

        #desc {
            text-align: center;
        }
    </style>
</head>
<body>

    <h1 id="title">Vortex Server Database Pie Chart</h1>
    <h2 id="desc">Stats are updated every hour</h2>
    <p style="text-align: center;/*! margin: auto; */display: block;margin-bottom: 25px;color: #fff;" href="submit.html"><a href="submit.html" style="text-align: center;/*! margin: auto; *//*! display: block; */margin-bottom: 25px;color: #ce48ff;">Submit your server</a> | <a href="index.html" style="text-align: center;/*! margin: auto; *//*! display: block; */margin-bottom: 25px;color: #ce48ff;">Home</a></p>

    <div class="chart-container">
        <canvas id="myPieChart"></canvas>
    </div>

    <script>

    let members = []
    let labels = []
    let colors = []

    let colorThief = new ColorThief();

    async function main() {

    let resp = await fetch("https://www.vortexserverdb.org/database.json")
    let db = await resp.json()

    db.forEach((server, index) => {
      members.push(Number(server.memberCount))
      labels.push(server.name)

      let imgForColorThief = new Image();
      imgForColorThief.crossOrigin = "anonymous" // avoid cors stuff
      imgForColorThief.src = server.icon;

      imgForColorThief.onload = function() {
        let color = colorThief.getColor(imgForColorThief , 1)

        colors[index] = ('#' + [color[0], color[1], color[2]].map(x => x.toString(16).padStart(2, '0')).join(''))
      }
    })

setTimeout(() => {

  let combined = labels.map((label, index) => {
    return {
      label: label,
      member: members[index],
      color: colors[index]
    };
  });

  combined.sort((a, b) => b.member - a.member);

    labels = combined.map(item => item.label)
    colors = combined.map(item => item.color)
    members = combined.map(item => item.member)

    console.log(members)

    console.log(colors)

        const chartData = {
            labels: labels,
            datasets: [{
                label: 'Members',
                data: members,
                backgroundColor: colors,
                borderWidth: 1
            }]
        };

        const config = {
            type: 'pie',
            data: chartData,
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: false,
                    },
                    title: {
                        display: true,
                        text: 'Vortex Server DB Servers - Pie Chart'
                    }
                }
            }
        };


            const ctx = document.getElementById('myPieChart').getContext('2d');
            new Chart(ctx, config);
        }, 3000); // wait three seconds to make sure everything loads (color thief needs all images to load to get the color)
    }

    main();
    </script>

</body>
</html>
